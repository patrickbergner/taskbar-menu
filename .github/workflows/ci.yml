name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false # the module has no dependencies, so there is no go.sum to key on

      - name: Vet
        run: go vet ./src/...

      - name: Test
        run: go test ./src/...

      - name: Build
        shell: cmd
        run: .\build.cmd
