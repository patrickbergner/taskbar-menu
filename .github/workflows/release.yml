name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write # gh release create

jobs:
  release:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false # the module has no dependencies, so there is no go.sum to key on

      - name: Resolve version
        id: version
        shell: pwsh
        run: |
          $version = (Get-Content VERSION -Raw).Trim()
          if ($version -notmatch '^\d+(\.\d+){0,3}$') {
            throw "VERSION holds '$version', expected 1-4 dot-separated numbers"
          }
          # build.cmd stamps VERSION into the exe's VERSIONINFO resource and into
          # --version, so a tag that disagrees would ship a binary contradicting the
          # release it is published under. Fail before anything is built.
          if (($env:GITHUB_REF -like 'refs/tags/*') -and ($env:GITHUB_REF_NAME -ne "v$version")) {
            throw "Tag $env:GITHUB_REF_NAME does not match VERSION (expected v$version)"
          }
          "version=$version" >> $env:GITHUB_OUTPUT
          Write-Host "Version: $version"

      - name: Vet
        run: go vet ./src/...

      - name: Test
        run: go test ./src/...

      - name: Build
        shell: cmd
        run: .\build.cmd

      - name: Package
        shell: pwsh
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          # build.cmd emits uppercase arch suffixes, the ZIP names use lowercase.
          $targets = @(
            @{ Bin = 'AMD64'; Tag = 'amd64' }
            @{ Bin = 'ARM64'; Tag = 'arm64' }
          )
          foreach ($t in $targets) {
            # Per-arch staging dir, so the two "Taskbar Menu" folders cannot collide.
            $stage = "dist\$($t.Tag)\Taskbar Menu"
            New-Item -ItemType Directory -Force -Path $stage | Out-Null

            # The arch suffix exists only to keep the two builds apart in bin\.
            Copy-Item "bin\TaskbarMenu-$($t.Bin).exe" (Join-Path $stage 'TaskbarMenu.exe')
            Copy-Item 'config.example.json', 'config.schema.json', 'LICENSE', 'src\dist\readme.txt' -Destination $stage

            # -Path is the directory itself, not its contents, so the archive holds a
            # single "Taskbar Menu" folder at its root.
            $zip = "dist\TaskbarMenu-$env:VERSION-$($t.Tag).zip"
            Compress-Archive -Path $stage -DestinationPath $zip -Force
            Write-Host "Packaged $zip"

            # Assert the layout rather than trust it. Also pins the separator: the
            # ZIP spec mandates '/', and .NET Framework's writer used '\'. pwsh 7
            # is on .NET 8+ and should not, but this is what proves it.
            $expected = @(
              'Taskbar Menu/TaskbarMenu.exe'
              'Taskbar Menu/config.example.json'
              'Taskbar Menu/config.schema.json'
              'Taskbar Menu/LICENSE'
              'Taskbar Menu/readme.txt'
            )
            $archive = [IO.Compression.ZipFile]::OpenRead((Get-Item $zip).FullName)
            try { $actual = @($archive.Entries | ForEach-Object FullName) }
            finally { $archive.Dispose() }
            if (Compare-Object $expected $actual) {
              throw "Unexpected layout in $($zip):`n  $($actual -join "`n  ")"
            }
          }

      - uses: actions/upload-artifact@v7
        with:
          name: TaskbarMenu-${{ steps.version.outputs.version }}
          path: dist/*.zip
          if-no-files-found: error
          compression-level: 0 # the payload is already-compressed ZIPs

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          $zips = @(Get-ChildItem 'dist\*.zip' | ForEach-Object FullName)
          if ($zips.Count -ne 2) {
            throw "Expected 2 archives in dist\, found $($zips.Count)"
          }
          gh release create $env:GITHUB_REF_NAME @zips --title "TaskbarMenu $env:VERSION" --generate-notes
